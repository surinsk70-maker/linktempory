<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Hub — รวมลิงก์ที่ใช้บ่อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;background:#0B0F1A;color:#E2E8F0;min-height:100vh;-webkit-user-select:none;-moz-user-select:none;user-select:none}
a{text-decoration:none;color:inherit}
input,select,button,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1E293B;border-radius:3px}

@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.15)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}

.orb1{position:fixed;top:-120px;right:-120px;width:400px;height:400px;background:radial-gradient(circle,rgba(59,130,246,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none;animation:float1 20s ease-in-out infinite}
.orb2{position:fixed;bottom:-100px;left:-100px;width:350px;height:350px;background:radial-gradient(circle,rgba(139,92,246,.10) 0%,transparent 70%);border-radius:50%;pointer-events:none;animation:float2 25s ease-in-out infinite}

.container{max-width:900px;margin:0 auto;padding:24px 16px 100px;position:relative;z-index:1}

.header{text-align:center;margin-bottom:28px;animation:fadeIn .6s ease-out}
.clock{font-size:clamp(36px,8vw,48px);font-weight:700;letter-spacing:2px;color:#F8FAFC}
.date{font-size:14px;color:#64748B;margin-top:2px}
.greeting{font-size:clamp(18px,5vw,24px);font-weight:600;color:#F1F5F9;margin:12px 0 4px}
.subtitle{font-size:14px;color:#64748B}

.search-wrap{position:relative;max-width:480px;margin:0 auto 20px;animation:fadeIn .6s ease-out .1s both}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.search-input{width:100%;padding:14px 44px;font-size:15px;background:#111827;border:1px solid #1E293B;border-radius:14px;color:#E2E8F0;outline:none;transition:border-color .2s}
.search-input:focus{border-color:#3B82F6}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#1E293B;border:none;color:#94A3B8;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center}
.search-clear.show{display:flex}

.cat-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;scrollbar-width:none;animation:fadeIn .6s ease-out .15s both}
.cat-filter::-webkit-scrollbar{display:none}
.cat-pill{padding:8px 16px;border-radius:20px;border:1px solid #1E293B;background:#111827;color:#94A3B8;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500}
.cat-pill:hover{border-color:#334155}
.cat-pill.active{background:rgba(59,130,246,.13);border-color:#3B82F6;color:#3B82F6}

.section{margin-bottom:32px;animation:fadeIn .5s ease-out both}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.section-title{font-size:16px;font-weight:600;color:#CBD5E1;white-space:nowrap}
.section-line{flex:1;height:1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#111827;border:1px solid #1E293B;border-radius:14px;padding:16px;transition:all .25s ease;box-shadow:0 2px 12px rgba(0,0,0,.2);cursor:pointer;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)}
.card-inner{display:flex;align-items:center;gap:14px}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon img{width:28px;height:28px;border-radius:4px}
.card-text{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;color:#F1F5F9;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{font-size:13px;color:#64748B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-arrow{font-size:18px;color:#475569;flex-shrink:0;transition:color .2s}
.card:hover .card-arrow{color:#3B82F6}

.empty-section{text-align:center;color:#475569;padding:24px 0;font-size:14px}
.no-result{text-align:center;color:#475569;padding:60px 20px;font-size:15px}
.no-result-icon{font-size:48px;margin-bottom:12px}

.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(59,130,246,.3);transition:all .25s ease;z-index:100;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1);box-shadow:0 8px 30px rgba(59,130,246,.4)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#0F172A;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:24px 20px 40px;border:1px solid #1E293B;border-bottom:none;animation:slideUp .3s ease-out}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:20px;font-weight:700;color:#F1F5F9}
.close-btn{background:#1E293B;border:none;color:#94A3B8;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.close-btn:hover{background:#334155}

.tabs{display:flex;gap:4px;margin-bottom:20px;background:#111827;border-radius:12px;padding:4px}
.tab{flex:1;padding:10px 0;border-radius:10px;border:none;background:transparent;color:#94A3B8;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.tab.active{background:#1E293B;color:#F1F5F9}

.form-section{margin-bottom:24px}
.form-label{font-size:15px;font-weight:600;color:#CBD5E1;margin-bottom:12px}
.input{width:100%;padding:12px 14px;margin-bottom:10px;background:#111827;border:1px solid #1E293B;border-radius:10px;color:#E2E8F0;font-size:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:#3B82F6}
.add-btn{width:100%;padding:12px 0;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.add-btn:hover{opacity:.9}

.cat-label-admin{border-left:3px solid;padding-left:10px;font-size:14px;font-weight:600;color:#CBD5E1;margin-bottom:8px}
.admin-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#111827;border-radius:10px;margin-bottom:6px;border:1px solid #1E293B}
.admin-link-title{font-size:14px;font-weight:500;color:#E2E8F0}
.admin-link-url{font-size:12px;color:#64748B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-btn{padding:6px 14px;border-radius:8px;border:1px solid #7F1D1D;background:rgba(127,29,29,.2);color:#FCA5A5;font-size:13px;cursor:pointer;flex-shrink:0;font-weight:500;transition:background .2s}
.del-btn:hover{background:rgba(127,29,29,.4)}
.empty-text{color:#475569;font-size:13px;padding-left:14px;margin-bottom:8px}
.flash{padding:10px 16px;border-radius:10px;background:#1E293B;color:#E2E8F0;font-size:14px;text-align:center;margin-bottom:16px;animation:fadeIn .3s ease-out}

.login-box{text-align:center;padding:40px 20px}
.login-box .input{max-width:300px;margin:0 auto 12px;text-align:center}
.login-title{font-size:32px;margin-bottom:8px}
.login-subtitle{color:#64748B;font-size:14px;margin-bottom:24px}
.login-error{color:#FCA5A5;font-size:13px;margin-top:8px}

.color-pick{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.color-pick label{color:#94A3B8;font-size:14px}
.color-pick input[type=color]{width:48px;height:36px;border:none;border-radius:8px;cursor:pointer;background:transparent}

/* Block warning overlay */
.block-warn{position:fixed;inset:0;background:#0B0F1A;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#64748B;font-size:15px;display:none}
.block-warn.show{display:flex}
.block-warn span{font-size:48px}

@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .container{padding:20px 12px 100px}
}
</style>
</head>
<body>

<div class="orb1"></div>
<div class="orb2"></div>
<div class="container" id="app"></div>
<button class="fab" id="fabBtn" title="จัดการลิงก์">⚙️</button>
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="block-warn" id="blockWarn">
  <span>🔒</span>
  <div>ไม่สามารถใช้งาน Developer Tools ได้</div>
  <div style="font-size:13px;color:#475569">กรุณาปิด DevTools แล้วรีเฟรชหน้าเว็บ</div>
</div>

<script>
// ╔══════════════════════════════════════════════════╗
// ║  🔒 ANTI-INSPECT PROTECTION                     ║
// ║  ป้องกันการดู Source Code สำหรับผู้ใช้ทั่วไป     ║
// ╚══════════════════════════════════════════════════╝

// 1) ปิดคลิกขวา
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// 2) ปิด keyboard shortcuts (F12, Ctrl+Shift+I/J/C, Ctrl+U)
document.addEventListener('keydown', function(e){
  if(e.key==='F12') { e.preventDefault(); return false; }
  if(e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
  if(e.ctrlKey && ['u','U','s','S'].includes(e.key)) { e.preventDefault(); return false; }
  if(e.metaKey && e.altKey && ['i','I','j','J','c','C'].includes(e.key)) { e.preventDefault(); return false; }
  if(e.metaKey && ['u','U','s','S'].includes(e.key)) { e.preventDefault(); return false; }
});

// 3) ตรวจจับ DevTools เปิดอยู่ (ใช้หลายวิธีรวมกัน)
(function(){
  var devOpen = false;
  // Method A: window size diff
  function checkA(){
    var w = window.outerWidth - window.innerWidth > 160;
    var h = window.outerHeight - window.innerHeight > 160;
    return w || h;
  }
  // Method B: debugger timing
  function checkB(){
    var s = performance.now();
    debugger;
    return performance.now() - s > 100;
  }
  // Method C: console.log object trick
  var element = new Image();
  Object.defineProperty(element,'id',{get:function(){ devOpen=true; }});

  setInterval(function(){
    devOpen = false;
    console.log('%c', element);
    if(devOpen || checkA()){
      document.getElementById('blockWarn').classList.add('show');
    } else {
      document.getElementById('blockWarn').classList.remove('show');
    }
  }, 1500);
})();

// 4) ปิด drag (ป้องกันลากรูป/ลิงก์ไปเปิดที่อื่น)
document.addEventListener('dragstart', function(e){ e.preventDefault(); });


// ╔══════════════════════════════════════════════════╗
// ║  🔑 PASSWORD HASH (SHA-256)                     ║
// ║  รหัสเริ่มต้น: admin1234                          ║
// ║  วิธีเปลี่ยน: ไปที่ sha256.online แล้ว hash       ║
// ║  รหัสใหม่ แล้วนำมาวางแทน ADMIN_HASH ข้างล่าง    ║
// ╚══════════════════════════════════════════════════╝
var ADMIN_HASH = "ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270";

async function sha256(text){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}


// ╔══════════════════════════════════════════════════╗
// ║  📦 DATA & STATE                                ║
// ╚══════════════════════════════════════════════════╝
var STORAGE_KEY = "lh_d";
var DEFAULT_DATA = {
  categories: [
    { id:"w", name:"\u{1F3E2} งาน", color:"#3B82F6", links:[
      { id:"1", title:"Google Drive", url:"https://drive.google.com", desc:"ไฟล์และเอกสาร" },
      { id:"2", title:"Gmail", url:"https://mail.google.com", desc:"อีเมล" },
      { id:"3", title:"Google Calendar", url:"https://calendar.google.com", desc:"ตารางนัดหมาย" }
    ]},
    { id:"s", name:"\u{1F4AC} โซเชียล", color:"#8B5CF6", links:[
      { id:"4", title:"Facebook", url:"https://facebook.com", desc:"เฟซบุ๊ก" },
      { id:"5", title:"LINE", url:"https://line.me", desc:"แชท" },
      { id:"6", title:"Instagram", url:"https://instagram.com", desc:"รูปภาพ" }
    ]},
    { id:"t", name:"\u{1F6E0}\u{FE0F} เครื่องมือ", color:"#10B981", links:[
      { id:"7", title:"ChatGPT", url:"https://chat.openai.com", desc:"AI ช่วยงาน" },
      { id:"8", title:"Canva", url:"https://canva.com", desc:"ออกแบบกราฟิก" },
      { id:"9", title:"Notion", url:"https://notion.so", desc:"จัดการโน้ต" }
    ]}
  ]
};

var data, searchTerm="", activeCat="all", adminTab="links", isAuth=false;
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function ld(){ try{ var d=localStorage.getItem(STORAGE_KEY); return d?JSON.parse(d):JSON.parse(JSON.stringify(DEFAULT_DATA)); }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DATA)); } }
function sd(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function fav(u){ try{ return "https://www.google.com/s2/favicons?domain="+new URL(u).hostname+"&sz=64"; }catch(e){ return null; } }
function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
data = ld();

function getG(){
  var h=new Date().getHours();
  if(h<6) return "\u{1F319} สวัสดีดึก";
  if(h<12) return "\u{2600}\u{FE0F} สวัสดีตอนเช้า";
  if(h<17) return "\u{1F324}\u{FE0F} สวัสดีตอนบ่าย";
  return "\u{1F306} สวัสดีตอนเย็น";
}
function getT(){ return new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); }
function getD(){ return new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }


// ╔══════════════════════════════════════════════════╗
// ║  🖥️ RENDER                                      ║
// ╚══════════════════════════════════════════════════╝
function render(){
  var tl=data.categories.reduce(function(s,c){return s+c.links.length},0);
  var filtered=data.categories
    .filter(function(c){return activeCat==="all"||c.id===activeCat})
    .map(function(c){return{id:c.id,name:c.name,color:c.color,links:c.links.filter(function(l){
      if(!searchTerm)return true;var q=searchTerm.toLowerCase();
      return l.title.toLowerCase().indexOf(q)!==-1||(l.desc||"").toLowerCase().indexOf(q)!==-1||l.url.toLowerCase().indexOf(q)!==-1;
    })}})
    .filter(function(c){return c.links.length>0||!searchTerm});

  var h='<header class="header"><div class="clock" id="clock">'+getT()+'</div><div class="date" id="dateStr">'+getD()+'</div><h1 class="greeting">'+getG()+'</h1><p class="subtitle">คุณมี '+tl+' ลิงก์ ใน '+data.categories.length+' หมวด</p></header>';
  h+='<div class="search-wrap"><span class="search-icon">\u{1F50D}</span><input class="search-input" id="searchInput" placeholder="ค้นหาลิงก์..." value="'+esc(searchTerm)+'"><button class="search-clear '+(searchTerm?'show':'')+'" id="searchClear">\u2715</button></div>';
  h+='<div class="cat-filter"><button class="cat-pill '+(activeCat==='all'?'active':'')+'" data-cat="all">ทั้งหมด</button>';
  data.categories.forEach(function(c){
    var s=activeCat===c.id?'style="background:'+c.color+'22;border-color:'+c.color+';color:'+c.color+'"':'';
    h+='<button class="cat-pill '+(activeCat===c.id?'active':'')+'" data-cat="'+c.id+'" '+s+'>'+esc(c.name)+'</button>';
  });
  h+='</div>';

  if(filtered.length===0&&searchTerm){
    h+='<div class="no-result"><div class="no-result-icon">\u{1F50D}</div>ไม่พบลิงก์ที่ตรงกับ "'+esc(searchTerm)+'"</div>';
  } else {
    filtered.forEach(function(cat){
      h+='<section class="section"><div class="section-header"><div class="section-dot" style="background:'+cat.color+'"></div><h2 class="section-title">'+esc(cat.name)+'</h2><div class="section-line" style="background:linear-gradient(90deg,'+cat.color+'44,transparent)"></div></div>';
      if(cat.links.length===0){h+='<div class="empty-section">ยังไม่มีลิงก์ในหมวดนี้</div>';}
      else{
        h+='<div class="grid">';
        cat.links.forEach(function(link){
          var f=fav(link.url);
          h+='<a class="card" href="'+esc(link.url)+'" target="_blank" rel="noopener noreferrer"><div class="card-inner"><div class="card-icon" style="background:'+cat.color+'18">';
          if(f){h+='<img src="'+f+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span style="display:none;font-size:22px">\u{1F517}</span>';}
          else{h+='<span style="font-size:22px">\u{1F517}</span>';}
          h+='</div><div class="card-text"><div class="card-title">'+esc(link.title)+'</div>';
          if(link.desc)h+='<div class="card-desc">'+esc(link.desc)+'</div>';
          h+='</div><div class="card-arrow">\u2192</div></div></a>';
        });
        h+='</div>';
      }
      h+='</section>';
    });
  }

  document.getElementById('app').innerHTML=h;
  var si=document.getElementById('searchInput');
  if(si){si.addEventListener('input',function(e){searchTerm=e.target.value;render();});si.focus();si.setSelectionRange(si.value.length,si.value.length);}
  document.getElementById('searchClear')&&document.getElementById('searchClear').addEventListener('click',function(){searchTerm='';render();});
  document.querySelectorAll('.cat-pill').forEach(function(b){b.addEventListener('click',function(){activeCat=b.dataset.cat;render();});});
}


// ╔══════════════════════════════════════════════════╗
// ║  🔧 ADMIN                                       ║
// ╚══════════════════════════════════════════════════╝
function openAdmin(){ if(!isAuth){renderLogin();}else{renderAP();} document.getElementById('overlay').classList.add('open'); }
function closeAdmin(){ document.getElementById('overlay').classList.remove('open'); }

function renderLogin(){
  document.getElementById('modal').innerHTML='<div class="modal-header"><h2 class="modal-title">\u{1F510} เข้าสู่ระบบแอดมิน</h2><button class="close-btn" id="closeModal">\u2715</button></div><div class="login-box"><div class="login-title">\u{1F512}</div><div class="login-subtitle">กรอกรหัสผ่านเพื่อจัดการลิงก์</div><input class="input" type="password" id="pwInput" placeholder="รหัสผ่าน" autocomplete="off"><button class="add-btn" id="loginBtn" style="max-width:300px;margin:0 auto">เข้าสู่ระบบ</button><div class="login-error" id="loginErr"></div></div>';
  document.getElementById('closeModal').addEventListener('click',closeAdmin);
  var pw=document.getElementById('pwInput');
  document.getElementById('loginBtn').addEventListener('click',async function(){
    var h=await sha256(pw.value);
    if(h===ADMIN_HASH){isAuth=true;renderAP();}
    else{document.getElementById('loginErr').textContent="\u274C รหัสผ่านไม่ถูกต้อง";}
  });
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn').click();});
  pw.focus();
}

function flash(m){var el=document.getElementById('adminFlash');if(el){el.textContent=m;el.style.display='block';setTimeout(function(){el.style.display='none'},2000);}}

function renderAP(){
  var m=document.getElementById('modal');
  var h='<div class="modal-header"><h2 class="modal-title">\u{1F527} จัดการลิงก์</h2><button class="close-btn" id="closeModal">\u2715</button></div><div class="flash" id="adminFlash" style="display:none"></div><div class="tabs"><button class="tab '+(adminTab==='links'?'active':'')+'" data-tab="links">จัดการลิงก์</button><button class="tab '+(adminTab==='cats'?'active':'')+'" data-tab="cats">จัดการหมวด</button></div>';

  if(adminTab==='links'){
    h+='<div class="form-section"><div class="form-label">เพิ่มลิงก์ใหม่</div><select class="input" id="aC"><option value="">\u2014 เลือกหมวด \u2014</option>';
    data.categories.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});
    h+='</select><input class="input" id="aT" placeholder="ชื่อลิงก์"><input class="input" id="aU" placeholder="URL (เช่น google.com)"><input class="input" id="aD" placeholder="คำอธิบาย (ไม่บังคับ)"><button class="add-btn" id="aLB">\uFF0B เพิ่มลิงก์</button></div>';
    h+='<div class="form-section"><div class="form-label">ลิงก์ทั้งหมด</div>';
    data.categories.forEach(function(cat){
      h+='<div style="margin-bottom:16px"><div class="cat-label-admin" style="border-left-color:'+cat.color+'">'+esc(cat.name)+'</div>';
      if(cat.links.length===0){h+='<div class="empty-text">ยังไม่มีลิงก์</div>';}
      else{cat.links.forEach(function(l){
        h+='<div class="admin-row"><div style="flex:1;min-width:0"><div class="admin-link-title">'+esc(l.title)+'</div><div class="admin-link-url">'+esc(l.url)+'</div></div><button class="del-btn" data-dc="'+cat.id+'" data-dl="'+l.id+'">ลบ</button></div>';
      });}
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="form-section"><div class="form-label">เพิ่มหมวดใหม่</div><input class="input" id="aCN" placeholder="ชื่อหมวด (เช่น \u{1F4DA} การเรียน)"><div class="color-pick"><label>สี:</label><input type="color" id="aCC" value="#3B82F6"></div><button class="add-btn" id="aCB">\uFF0B เพิ่มหมวด</button></div>';
    h+='<div class="form-section"><div class="form-label">หมวดทั้งหมด</div>';
    data.categories.forEach(function(cat){
      h+='<div class="admin-row"><div style="display:flex;align-items:center;gap:10px;flex:1"><div style="width:16px;height:16px;border-radius:4px;background:'+cat.color+';flex-shrink:0"></div><span style="color:#E2E8F0">'+esc(cat.name)+'</span><span style="color:#64748B;font-size:13px">('+cat.links.length+' ลิงก์)</span></div><button class="del-btn" data-dco="'+cat.id+'">ลบ</button></div>';
    });
    h+='</div>';
  }

  m.innerHTML=h;

  document.getElementById('closeModal').addEventListener('click',closeAdmin);
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){adminTab=t.dataset.tab;renderAP();});});

  var alb=document.getElementById('aLB');
  if(alb) alb.addEventListener('click',function(){
    var cid=document.getElementById('aC').value,ti=document.getElementById('aT').value.trim(),ur=document.getElementById('aU').value.trim(),de=document.getElementById('aD').value.trim();
    if(!cid||!ti||!ur){flash("\u26A0\uFE0F กรุณากรอกข้อมูลให้ครบ");return;}
    if(!/^https?:\/\//.test(ur))ur="https://"+ur;
    var c=data.categories.find(function(x){return x.id===cid});
    if(c){c.links.push({id:uid(),title:ti,url:ur,desc:de});sd();render();renderAP();flash("\u2705 เพิ่มลิงก์แล้ว");}
  });

  document.querySelectorAll('[data-dl]').forEach(function(b){b.addEventListener('click',function(){
    var c=data.categories.find(function(x){return x.id===b.dataset.dc});
    if(c){c.links=c.links.filter(function(l){return l.id!==b.dataset.dl});sd();render();renderAP();flash("\u{1F5D1}\uFE0F ลบลิงก์แล้ว");}
  });});

  var acb=document.getElementById('aCB');
  if(acb) acb.addEventListener('click',function(){
    var n=document.getElementById('aCN').value.trim(),co=document.getElementById('aCC').value;
    if(!n){flash("\u26A0\uFE0F กรุณาใส่ชื่อหมวด");return;}
    data.categories.push({id:uid(),name:n,color:co,links:[]});sd();render();renderAP();flash("\u2705 เพิ่มหมวดแล้ว");
  });

  document.querySelectorAll('[data-dco]').forEach(function(b){b.addEventListener('click',function(){
    if(!confirm("ลบหมวดนี้และลิงก์ทั้งหมดในหมวด?"))return;
    data.categories=data.categories.filter(function(c){return c.id!==b.dataset.dco});sd();render();renderAP();flash("\u{1F5D1}\uFE0F ลบหมวดแล้ว");
  });});
}

document.getElementById('fabBtn').addEventListener('click',openAdmin);
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closeAdmin();});
setInterval(function(){var c=document.getElementById('clock'),d=document.getElementById('dateStr');if(c)c.textContent=getT();if(d)d.textContent=getD();},30000);

render();
</script>
</body>
</html>
